<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="dashboard-container">

        <h1>Welcome, {{ current_user.username }}</h1>

        <p class="role-text">
            Role: {{ current_user.role }}
        </p>

        <div class="card-grid">

            <a href="{{ url_for('create_ticket') }}" class="dashboard-card">
                <h2>Create Ticket</h2>
                <p>Submit a new support request.</p>
            </a>

            <a href="{{ url_for('tickets') }}" class="dashboard-card">
                <h2>My Tickets</h2>
                <p>View and manage your tickets.</p>
            </a>

        </div>

        <a href="{{ url_for('logout') }}" class="logout-btn">
            Logout
        </a>

    </div>

</body>
</html>
