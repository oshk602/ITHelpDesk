{% extends "base.html" %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}

<div class="dashboard-container">

    <h1>Welcome, {{ current_user.username }}</h1>

    <p>Role: {{ current_user.role }}</p>

    <div class="card-grid">

        <a href="{{ url_for('create_ticket') }}"
           class="dashboard-card">

            <h2>Create Ticket</h2>
            <p>Submit a new support request.</p>

        </a>

        <a href="{{ url_for('tickets') }}"
           class="dashboard-card">

            <h2>My Tickets</h2>
            <p>View existing tickets.</p>

        </a>

    </div>

</div>

{% endblock %}
