<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

    <h1>Login</h1>

    <form method="POST">

        {{ form.hidden_tag() }}

        <p>
            {{ form.identifier.label }}<br>
            {{ form.identifier() }}

            {% for error in form.identifier.errors %}
                <span style="color:red;">
                    {{ error }}
                </span>
            {% endfor %}
        </p>

        <p>
            {{ form.password.label }}<br>
            {{ form.password() }}

            {% for error in form.password.errors %}
                <span style="color:red;">
                    {{ error }}
                </span>
            {% endfor %}
        </p>

        <p>
            {{ form.submit() }}
        </p>

    </form>

</body>
</html>
