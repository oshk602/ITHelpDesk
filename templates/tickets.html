{% extends "base.html" %}

{% block title %}
My Tickets
{% endblock %}

{% block content %}

<div class="page-container">

    <h1>My Tickets</h1>

    {% for ticket in tickets %}

        <div class="ticket-card">

            <h2>{{ ticket.title }}</h2>

            <p>{{ ticket.description }}</p>

            <div class="ticket-footer">

                <span class="status-badge">
                    {{ ticket.status }}
                </span>

            </div>

        </div>

    {% endfor %}

</div>

{% endblock %}
